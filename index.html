<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رفع النقاط بالصور</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: #f2f4f7; color: #1d2433; }
  header { background: #1f4e79; color: #fff; padding: 12px 16px; font-size: 18px; font-weight: bold;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .bar { display: flex; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
  button { border: 0; border-radius: 10px; padding: 12px 14px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit; }
  #captureBtn { background: #2e7d32; color: #fff; flex: 2; min-width: 170px; }
  #pdfBtn { background: #c62828; color: #fff; flex: 1; min-width: 120px; }
  #undoBtn, #clearBtn { background: #e0e0e0; color: #333; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .options { display: flex; gap: 14px; padding: 0 16px 6px; flex-wrap: wrap; align-items: center; font-size: 13px; }
  .seg { display: inline-flex; background: #e3e7ee; border-radius: 10px; padding: 3px; }
  .seg button { background: transparent; color: #444; padding: 7px 12px; font-size: 13px; border-radius: 8px; }
  .seg button.on { background: #fff; color: #1f4e79; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  header .seg { background: rgba(255,255,255,.18); }
  header .seg button { color: #fff; }
  header .seg button.on { background: #fff; color: #1f4e79; }

  #status { padding: 4px 16px; font-size: 13px; color: #555; min-height: 22px; }

  /* ملخص المساحات */
  #summary { display: none; margin: 4px 16px 8px; gap: 8px; flex-wrap: wrap; }
  #summary.show { display: flex; }
  .stat { background: #fff; border: 1px solid #d5dbe5; border-radius: 10px; padding: 8px 12px; flex: 1; min-width: 130px; }
  .stat small { display: block; color: #667; font-size: 12px; }
  .stat b { font-size: 16px; color: #1f4e79; }
  .stat.pct b { color: #e65100; font-size: 20px; }
  .stat.pct b.msg { font-size: 13px; color: #a33; }
  .stat em { display: block; font-style: normal; font-size: 11px; color: #667; margin-top: 2px; }
  .track-btn { background: #00897b; color: #fff; padding: 9px 14px; font-size: 14px; }
  .track-btn.on { background: #c62828; }
  .track-info { font-size: 12px; color: #455; }

  /* ===== الكاميرا داخل الصفحة ===== */
  #camModal { display: none; position: fixed; inset: 0; z-index: 5000; background: #000; color: #fff; flex-direction: column; }
  #camModal.open { display: flex; }
  .cam-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 10px; }
  .cam-top span { font-weight: bold; font-size: 15px; }
  .cam-ic { background: rgba(255,255,255,.15); color: #fff; width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 18px; }
  .cam-list { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 8px; scrollbar-width: none; }
  .cam-list::-webkit-scrollbar { display: none; }
  .cam-list button { flex: 0 0 auto; background: rgba(255,255,255,.14); color: #fff; padding: 8px 12px; font-size: 13px; border-radius: 20px; white-space: nowrap; }
  .cam-list button.on { background: #ffd54f; color: #000; }
  .cam-view { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #camVideo, #camShot { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #camShot { display: none; position: absolute; inset: 0; }
  #camModal.review #camShot { display: block; }
  #camModal.review #camVideo { visibility: hidden; }
  #camMsg { position: absolute; inset: auto 16px 16px; text-align: center; font-size: 14px; background: rgba(0,0,0,.6); border-radius: 10px; padding: 8px; display: none; }
  #camMsg.show { display: block; }
  .cam-bar { display: flex; align-items: center; justify-content: space-around; padding: 16px 12px 26px; gap: 12px; }
  #camReview { display: none; }
  #camModal.review #camReview { display: flex; }
  #camModal.review #camLive { display: none; }
  #camShutter { width: 74px; height: 74px; border-radius: 50%; background: #fff; border: 6px solid rgba(255,255,255,.4); background-clip: padding-box; padding: 0; }
  #camShutter:active { transform: scale(.93); }
  .cam-side { width: 64px; background: transparent; color: #fff; font-size: 12px; padding: 4px; line-height: 1.5; }
  .cam-act { flex: 1; padding: 14px; font-size: 16px; }
  .cam-act.retake { background: #424242; color: #fff; }
  .cam-act.use { background: #2e7d32; color: #fff; }

  /* شريط التحديد على الخريطة */
  #pickBar { display: none; margin: 0 16px 8px; background: #fff3e0; border: 2px solid #ef6c00; color: #8a3b00;
    border-radius: 10px; padding: 10px 12px; font-weight: bold; font-size: 14px; align-items: center; gap: 10px; justify-content: space-between; }
  #pickBar.show { display: flex; }
  #pickBar button { background: #ef6c00; color: #fff; padding: 8px 14px; font-size: 13px; }
  body.picking #map { cursor: crosshair; outline: 3px solid #ef6c00; }

  #map { border-radius: 12px; border: 1px solid #ccd; height: 60vh; margin: 0 16px; }
  body.mobile #map, body.web #map { margin: 0; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 12.5px; }
  th, td { border: 1px solid #ccd; padding: 6px 4px; text-align: center; }
  th { background: #1f4e79; color: #fff; position: sticky; top: 0; z-index: 1; }
  td img { width: 56px; height: 42px; object-fit: cover; border-radius: 4px; }
  td .ll { direction: ltr; font-family: Arial; white-space: nowrap; font-size: 12px; }
  td .pk { color: #e65100; }
  td .mini { padding: 5px 8px; font-size: 12px; border-radius: 7px; margin: 2px; }
  .btn-pick { background: #ef6c00; color: #fff; }
  .btn-del { background: #eee; color: #a00; }
  .dist { font-weight: bold; color: #e65100; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #eef3fa; }
  tfoot td { background: #fff8f0; font-weight: bold; }

  body.mobile .layout { padding: 0 16px 30px; }
  body.mobile #map { height: 60vh; }
  body.mobile .side { margin-top: 10px; overflow-x: auto; }

  body.web .layout { display: grid; grid-template-columns: 1fr 560px; gap: 14px; padding: 0 16px 16px; height: calc(100vh - 230px); min-height: 450px; }
  body.web #map { height: 100%; }
  body.web .side { overflow: auto; border: 1px solid #ccd; border-radius: 12px; background: #fff; }

  .letter-icon { background: #fff; color: #000; border: 3px solid #000; border-radius: 50%;
    width: 34px; height: 34px; line-height: 28px; text-align: center; font-weight: bold; font-size: 15px;
    box-shadow: 0 1px 5px rgba(0,0,0,.5); font-family: Arial; }
  .pick-icon { background: #ef6c00; color: #fff; border: 2px solid #fff; border-radius: 7px;
    width: 34px; height: 26px; line-height: 22px; text-align: center; font-weight: bold; font-size: 13px;
    box-shadow: 0 1px 5px rgba(0,0,0,.5); font-family: Arial; }
  .dist-tip { background: #ef6c00; color: #fff; border: 0; font-weight: bold; font-family: Arial; padding: 2px 6px; }
  .dist-tip::before { display: none; }
  .popup-box { text-align: center; direction: rtl; font-family: Tahoma, Arial; }
  .popup-box img { width: 180px; height: 135px; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 6px; }
  .popup-box button { margin-top: 6px; padding: 6px 10px; font-size: 12px; background: #ef6c00; color: #fff; }

  html, body { overflow-x: hidden; max-width: 100%; }
  /* التقرير مخفي ولا يُظهر إلا لحظة التصدير، ولا يوسّع الصفحة */
  #report { display: none; position: fixed; top: 0; left: 0; z-index: -1; width: 794px; background: #fff; padding: 30px; direction: rtl; font-family: Tahoma, Arial; }
  #report.on { display: block; }
  #report h2 { text-align: center; color: #1f4e79; margin: 0 0 6px; }
  #report .meta { text-align: center; font-size: 12px; color: #555; margin-bottom: 10px; }
  #report .sumrow { display: flex; gap: 8px; margin-bottom: 10px; }
  #report .sumrow div { flex: 1; border: 1px solid #ccd; border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; }
  #report .sumrow b { display: block; font-size: 15px; color: #1f4e79; }
  #report .sumrow .p b { color: #e65100; }
  #report table { width: 100%; margin: 0; font-size: 12px; }
  #report th { position: static; }
  #report .shape { text-align: center; margin: 6px 0 12px; }
  #report .legend { font-size: 11px; color: #444; text-align: center; margin-top: 4px; }
  #report .legend span { display: inline-block; width: 18px; height: 6px; vertical-align: middle; margin: 0 4px 0 10px; }
  #report .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #report .card { border: 1px solid #ccd; border-radius: 6px; padding: 5px; text-align: center; font-size: 10.5px; height: 196px; overflow: hidden; }
  #report .card img { width: 100%; height: 118px; object-fit: cover; border-radius: 4px; display: block; }
  #report .card b { font-size: 14px; color: #1f4e79; font-family: Arial; }
  #report .card .c { direction: ltr; font-family: Arial; }
  #report .card .o { direction: ltr; font-family: Arial; color: #e65100; }
</style>
</head>
<body>

<header>
  <span>📍 رفع النقاط بالصور</span>
  <span class="seg" id="viewSeg">
    <button data-v="mobile">📱 جوال</button>
    <button data-v="web">🖥️ ويب</button>
  </span>
</header>

<div class="bar">
  <button id="captureBtn">📷 التقاط صورة / نقطة</button>
  <button id="pdfBtn" disabled>📄 تصدير PDF</button>
  <button id="undoBtn" disabled>↶ تراجع</button>
  <button id="clearBtn">مسح</button>
</div>

<div class="options">
  <span>نوع الرسم:</span>
  <span class="seg" id="shapeSeg">
    <button data-s="closed">⬠ شكل مغلق (أرض)</button>
    <button data-s="open">〰 مسار مفتوح (طريق)</button>
  </span>
  <label><input type="checkbox" id="autoPick" checked> حدّد إحداثية ثانية بعد كل صورة</label>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<input type="file" id="galleryInput" accept="image/*" multiple style="display:none">

<!-- الكاميرا داخل الصفحة -->
<div id="camModal">
  <div class="cam-top">
    <button id="camClose" class="cam-ic" aria-label="إغلاق">✖</button>
    <span id="camTitle">التقاط صورة</span>
    <button id="camSwitch" class="cam-ic" aria-label="الكاميرا التالية">🔄</button>
  </div>
  <div id="camList" class="cam-list"></div>
  <div class="cam-view">
    <video id="camVideo" autoplay playsinline muted></video>
    <img id="camShot" alt="">
    <div id="camMsg"></div>
  </div>
  <div class="cam-bar" id="camLive">
    <button id="camGallery" class="cam-side">🖼️<br>المعرض</button>
    <button id="camShutter" aria-label="التقاط"></button>
    <button id="camApps" class="cam-side">📲<br>تطبيق كاميرا</button>
  </div>
  <div class="cam-bar" id="camReview">
    <button id="camRetake" class="cam-act retake">↺ إعادة</button>
    <button id="camUse" class="cam-act use">✔ استخدام الصورة</button>
  </div>
</div>

<div id="status">اضغط "التقاط صورة" عند كل نقطة — النقاط تُحفظ تلقائياً.</div>

<div class="options">
  <button id="trackBtn" class="track-btn">🚶 بدء تتبع المشي</button>
  <span id="trackInfo" class="track-info"></span>
</div>

<div id="summary">
  <div class="stat"><small>إجمالي المسافة الممشاة</small><b id="sWalk">—</b><em id="sWalkSub"></em></div>
  <div class="stat"><small id="sSpecLabel">إجمالي المسافة المحددة</small><b id="sSpec">—</b><em id="sSpecSub"></em></div>
  <div class="stat pct"><small>نسبة المسافة المحددة من الممشاة</small><b id="sPct">—</b></div>
</div>

<div id="pickBar">
  <span id="pickText"></span>
  <button id="pickCancel">تخطي</button>
</div>

<div class="layout">
  <div id="map"></div>
  <div class="side">
    <table id="pointsTable">
      <thead><tr><th>النقطة</th><th>الصورة</th><th>إحداثيات الصورة</th><th>الإحداثية المحددة</th><th>المسافة بينهما</th><th>الوقت</th></tr></thead>
      <tbody></tbody>
      <tfoot></tfoot>
    </table>
  </div>
</div>

<div id="report"></div>

<script>
  let points = [];
  let photoMarkers = [];
  let pickTarget = null;
  const statusEl = document.getElementById('status');
  const pdfBtn = document.getElementById('pdfBtn');
  const undoBtn = document.getElementById('undoBtn');
  const cameraInput = document.getElementById('cameraInput');
  const autoPick = document.getElementById('autoPick');
  const letter = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const pickName = p => p.name + "'";

  // ===== إعدادات تتبع المشي =====
  const ACC_LIMIT = 25;   // حد الدقة بالمتر: أي نقطة GPS دقتها أسوأ من هذا تُستبعد من المسافة الممشاة
  const MIN_STEP = 5;     // لا تُسجَّل نقطة جديدة إلا إذا تحرك المستخدم 5 م على الأقل (يمنع تذبذب GPS أثناء الوقوف)
  let track = [];         // نقاط المسار المقبولة بالترتيب
  let rejected = 0;       // عدد النقاط المستبعدة لضعف الدقة
  let watchId = null;
  let wakeLock = null;

  // ===== الإعدادات =====
  function getSetting(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function setSetting(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  let viewMode = getSetting('pm_view', window.innerWidth >= 900 ? 'web' : 'mobile');
  let shapeMode = getSetting('pm_shape', 'closed');
  autoPick.checked = getSetting('pm_autopick', '1') === '1';
  autoPick.onchange = () => setSetting('pm_autopick', autoPick.checked ? '1' : '0');
  const isClosed = () => shapeMode === 'closed';

  // ===== الحفظ التلقائي =====
  const DB = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('photoMapDB', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('data');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async save(val, key = 'points') {
      try {
        const db = await this.open();
        await new Promise((res, rej) => {
          const tx = db.transaction('data', 'readwrite');
          tx.objectStore('data').put(val, key);
          tx.oncomplete = res; tx.onerror = () => rej(tx.error);
        });
        return true;
      } catch (e) { return false; }
    },
    async load(key = 'points', def = []) {
      try {
        const db = await this.open();
        return await new Promise(res => {
          const r = db.transaction('data').objectStore('data').get(key);
          r.onsuccess = () => res(r.result || def);
          r.onerror = () => res(def);
        });
      } catch (e) { return def; }
    }
  };
  const persistTrack = () => DB.save({ track, rejected }, 'track');
  async function persist() {
    const ok = await DB.save(points);
    if (!ok) statusEl.textContent = '⚠️ تعذّر الحفظ التلقائي في هذا المتصفح — لا تغلق الصفحة قبل التصدير.';
  }

  // ===== الحسابات =====
  function distM(a, b) {
    const R = 6371008.8, r = Math.PI / 180;
    const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // مساحة ومحيط مجموعة إحداثيات
  function polyStats(coords, closed) {
    if (coords.length < 2) return { area: 0, perim: 0 };
    const R = 6371008.8, lat0 = coords[0].lat * Math.PI / 180;
    const xy = coords.map(p => [R * p.lng * Math.PI / 180 * Math.cos(lat0), R * p.lat * Math.PI / 180]);
    let area = 0, perim = 0;
    const cl = closed && xy.length >= 3;
    for (let i = 0; i < xy.length; i++) {
      const [x1, y1] = xy[i], [x2, y2] = xy[(i + 1) % xy.length];
      area += x1 * y2 - x2 * y1;
      if (i < xy.length - 1 || cl) perim += Math.hypot(x2 - x1, y2 - y1);
    }
    return { area: cl ? Math.abs(area) / 2 : 0, perim };
  }
  const photoCoords = () => points.map(p => ({ lat: p.lat, lng: p.lng }));
  // الإحداثيات المحددة يدوياً فقط، بالترتيب (إحداثيات الصور لا تدخل في حساب النسبة)
  const pickedCoords = () => points.filter(p => p.pick).map(p => p.pick);
  const pickedCount = () => points.filter(p => p.pick).length;

  // إجمالي المسافة المحددة (بالمتر)
  function specStats() {
    const k = pickedCoords(), n = k.length;
    if (n < 2) return { n, dist: null, closed: false, label: 'إجمالي المسافة المحددة', area: null };
    let d = 0;
    for (let i = 0; i < n - 1; i++) d += distM(k[i], k[i + 1]);
    const closed = n >= 3 && isClosed();          // نقطتان = مسار مفتوح دائماً
    if (closed) d += distM(k[n - 1], k[0]);       // إغلاق الشكل: من آخر نقطة إلى أول نقطة
    return {
      n, dist: d, closed,
      label: closed ? 'محيط الشكل (مغلق)' : 'إجمالي المسافة المحددة (مسار مفتوح)',
      area: closed ? polyStats(k, true).area : null
    };
  }

  // إجمالي المسافة الممشاة (بالمتر): مجموع المسافات بين كل نقطة مسار والتي تليها
  function walkedDist() {
    let d = 0;
    for (let i = 0; i < track.length - 1; i++) d += distM(track[i], track[i + 1]);
    return d;
  }

  // النسبة = (المسافة المحددة ÷ المسافة الممشاة) × 100 ، كلها بالمتر
  const NO_WALK_MSG = 'لا يمكن حساب النسبة لعدم توفر مسافة ممشاة';
  function ratio() {
    const w = walkedDist(), s = specStats();
    if (!(w > 0) || !isFinite(w)) return { ok: false, text: NO_WALK_MSG };
    if (s.dist === null) return { ok: false, text: 'حدّد إحداثيتين على الأقل' };
    const pct = s.dist / w * 100;
    if (!isFinite(pct)) return { ok: false, text: NO_WALK_MSG };
    const r = pct < 10 ? Math.round(pct * 100) / 100 : Math.round(pct * 10) / 10;
    return { ok: true, pct, text: r + '%' };
  }
  const fmtLen = m => m >= 1000 ? (m / 1000).toFixed(2) + ' كم' : m.toFixed(1) + ' م';
  const fmtArea = a => a >= 10000 ? (a / 10000).toFixed(2) + ' هكتار' : a.toFixed(1) + ' م²';
  const fmtAreaFull = a => a >= 10000 ? (a / 10000).toFixed(2) + ' هكتار (' + Math.round(a).toLocaleString('en') + ' م²)' : a.toFixed(1) + ' م²';
  const ll = c => `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;

  // ===== الخريطة =====
  const map = L.map('map').setView([24.7136, 46.6753], 6);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 20, maxNativeZoom: 19, attribution: 'Esri'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 20, maxNativeZoom: 19
  }).addTo(map);
  const shape = L.polygon([], { color: '#3b3bff', weight: 6, fillColor: '#3b3bff', fillOpacity: 0.12 }).addTo(map);
  const line = L.polyline([], { color: '#3b3bff', weight: 6 }).addTo(map);
  const pickShape = L.polygon([], { color: '#ef6c00', weight: 4, dashArray: '10 8', fillColor: '#ef6c00', fillOpacity: 0.18 }).addTo(map);
  const pickLine = L.polyline([], { color: '#ef6c00', weight: 4, dashArray: '10 8' }).addTo(map);
  const trackLine = L.polyline([], { color: '#00e676', weight: 3, opacity: 0.95 }).addTo(map);
  const layer = L.layerGroup().addTo(map);

  // ===== تتبع المشي =====
  const trackBtn = document.getElementById('trackBtn');
  function updateTrackInfo() {
    const w = walkedDist();
    document.getElementById('trackInfo').textContent =
      (watchId !== null ? '🟢 جاري التتبع — ' : '') +
      `نقاط المسار: ${track.length} مقبولة، ${rejected} مستبعدة (دقة أسوأ من ${ACC_LIMIT} م)` +
      (track.length > 1 ? ` — المسافة: ${fmtLen(w)}` : '');
  }
  async function keepAwake() {
    try { if ('wakeLock' in navigator && watchId !== null) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  function onTrackPos(pos) {
    const c = pos.coords;
    if (!(c.accuracy <= ACC_LIMIT)) { rejected++; updateTrackInfo(); return; }   // استبعاد الدقة الضعيفة
    const pt = { lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6), acc: Math.round(c.accuracy), t: Date.now() };
    const last = track[track.length - 1];
    if (last && distM(last, pt) < MIN_STEP) return;
    track.push(pt);
    trackLine.addLatLng([pt.lat, pt.lng]);
    persistTrack();
    updateTrackInfo();
    updateSummary();
  }
  function startTrack() {
    if (!navigator.geolocation) { statusEl.textContent = 'المتصفح لا يدعم تحديد الموقع.'; return; }
    watchId = navigator.geolocation.watchPosition(onTrackPos,
      err => { statusEl.textContent = 'تعذّر تتبع الموقع: ' + err.message; },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
    trackBtn.textContent = '⏹ إيقاف تتبع المشي';
    trackBtn.classList.add('on');
    keepAwake();
    updateTrackInfo();
    statusEl.textContent = 'بدأ تتبع المشي — أبقِ الصفحة مفتوحة أثناء المشي.';
  }
  function stopTrack() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
    trackBtn.textContent = track.length ? '🚶 متابعة تتبع المشي' : '🚶 بدء تتبع المشي';
    trackBtn.classList.remove('on');
    updateTrackInfo();
  }
  trackBtn.onclick = () => watchId === null ? startTrack() : stopTrack();

  // ===== أزرار الاختيار =====
  function applyView() {
    document.body.classList.toggle('web', viewMode === 'web');
    document.body.classList.toggle('mobile', viewMode !== 'web');
    document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === viewMode));
    setTimeout(() => { map.invalidateSize(); fitAll(); }, 150);
  }
  function applyShape() {
    document.querySelectorAll('#shapeSeg button').forEach(b => b.classList.toggle('on', b.dataset.s === shapeMode));
  }
  document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => {
    viewMode = b.dataset.v; setSetting('pm_view', viewMode); applyView();
  });
  document.querySelectorAll('#shapeSeg button').forEach(b => b.onclick = () => {
    shapeMode = b.dataset.s; setSetting('pm_shape', shapeMode); applyShape(); redraw();
  });

  // ===== الالتقاط =====
  document.getElementById('captureBtn').onclick = () => { stopPick(); openCamera(); };

  // تحديد الموقع ثم إضافة النقطة (مشترك بين الكاميرا والمعرض)
  function locateAndAdd(imgData) {
    statusEl.textContent = 'جاري تحديد الموقع...';
    if (!navigator.geolocation) { statusEl.textContent = 'المتصفح لا يدعم تحديد الموقع.'; return; }
    navigator.geolocation.getCurrentPosition(
      pos => addPoint(imgData, pos.coords),
      err => { statusEl.textContent = 'تعذّر تحديد الموقع: فعّل الموقع واسمح للمتصفح بالوصول. (' + err.message + ')'; },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
  // ===== قراءة الموقع والوقت من داخل الصورة (EXIF) =====
  function readExif(buf) {
    try {
      const v = new DataView(buf);
      if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;   // JPEG فقط
      let off = 2;
      while (off + 4 < v.byteLength) {
        const m = v.getUint16(off);
        if ((m & 0xFF00) !== 0xFF00) break;
        const len = v.getUint16(off + 2);
        if (m === 0xFFE1 && v.getUint32(off + 4) === 0x45786966) return parseTiff(v, off + 10);
        if (m === 0xFFDA) break;
        off += 2 + len;
      }
    } catch (e) {}
    return null;
  }
  function parseTiff(v, t) {
    const le = v.getUint16(t) === 0x4949;
    const u16 = o => v.getUint16(o, le), u32 = o => v.getUint32(o, le);
    const SIZE = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
    const ifd = o => {
      const n = u16(o), tags = {};
      for (let i = 0; i < n; i++) { const e = o + 2 + i * 12; tags[u16(e)] = { type: u16(e + 2), count: u32(e + 4), at: e + 8 }; }
      return tags;
    };
    const ptr = tg => (SIZE[tg.type] || 1) * tg.count <= 4 ? tg.at : t + u32(tg.at);
    const rat = o => { const d = u32(o + 4); return d ? u32(o) / d : 0; };
    const str = tg => { const p = ptr(tg); let s = ''; for (let i = 0; i < tg.count; i++) { const c = v.getUint8(p + i); if (!c) break; s += String.fromCharCode(c); } return s; };
    const out = {};
    const ifd0 = ifd(t + u32(t + 4));
    if (ifd0[0x8825]) {
      const g = ifd(t + u32(ifd0[0x8825].at));
      if (g[2] && g[4]) {
        const dms = tg => { const p = ptr(tg); return rat(p) + rat(p + 8) / 60 + rat(p + 16) / 3600; };
        let lat = dms(g[2]), lng = dms(g[4]);
        if (g[1] && str(g[1]).toUpperCase() === 'S') lat = -lat;
        if (g[3] && str(g[3]).toUpperCase() === 'W') lng = -lng;
        if ((lat || lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) { out.lat = lat; out.lng = lng; }
        if (g[0x1F]) out.acc = rat(ptr(g[0x1F]));
      }
    }
    const toDate = s => { const m = (s || '').match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null; };
    if (ifd0[0x8769]) {
      const ex = ifd(t + u32(ifd0[0x8769].at));
      const tg = ex[0x9003] || ex[0x9004];
      if (tg) out.date = toDate(str(tg));
    }
    if (!out.date && ifd0[0x0132]) out.date = toDate(str(ifd0[0x0132]));
    return out;
  }
  function getHere() {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('no geolocation'));
      navigator.geolocation.getCurrentPosition(p => res(p.coords), rej, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }

  // صورة أو عدة صور من المعرض / تطبيق كاميرا
  async function fromFileInput(e) {
    const input = e.target, files = [...input.files];
    input.value = '';
    if (!files.length) return;
    closeCamera();
    statusEl.textContent = files.length > 1 ? `جاري قراءة ${files.length} صور...` : 'جاري قراءة الصورة...';

    const items = [];
    for (const f of files) {
      let ex = null;
      try { ex = readExif(await f.arrayBuffer()); } catch (_) {}
      items.push({ f, ex, t: ex && ex.date ? ex.date.getTime() : f.lastModified });
    }
    items.sort((a, b) => a.t - b.t);   // ترتيب حسب وقت التصوير

    const hasGps = it => it.ex && it.ex.lat !== undefined;
    let here = null;
    if (items.some(it => !hasGps(it))) {
      statusEl.textContent = 'بعض الصور بلا موقع — جاري أخذ موقعك الحالي...';
      try { here = await getHere(); } catch (_) {}
    }

    const batch = items.length > 1;
    let fromPhoto = 0, fromHere = 0, failed = 0;
    for (const it of items) {
      const img = await resizeImage(it.f, 800);
      const time = it.ex && it.ex.date ? it.ex.date.toLocaleString('ar-SA') : null;
      if (hasGps(it)) {
        await addPoint(img, { latitude: it.ex.lat, longitude: it.ex.lng, accuracy: it.ex.acc }, { time, src: 'exif', noPick: batch });
        fromPhoto++;
      } else if (here) {
        await addPoint(img, here, { time, src: 'gps', noPick: batch });
        fromHere++;
      } else failed++;
    }

    const parts = [];
    if (fromPhoto) parts.push(`${fromPhoto} من موقع التصوير داخل الصورة 📷`);
    if (fromHere) parts.push(`${fromHere} من موقعك الحالي (الصورة بلا موقع)`);
    if (failed) parts.push(`${failed} لم تُضف لتعذّر تحديد الموقع`);
    statusEl.textContent = (batch ? `تمت إضافة الصور: ` : 'تمت الإضافة: ') + parts.join(' — ') +
      (batch && autoPick.checked ? ' — حدّد الإحداثيات الثانية من الجدول.' : '');
  }
  cameraInput.onchange = fromFileInput;
  document.getElementById('galleryInput').onchange = fromFileInput;

  // ===== الكاميرا داخل الصفحة مع اختيار أي كاميرا في الجوال =====
  const camModal = document.getElementById('camModal');
  const camVideo = document.getElementById('camVideo');
  const camShot = document.getElementById('camShot');
  const camMsg = document.getElementById('camMsg');
  const camList = document.getElementById('camList');
  let camStream = null, cams = [], camId = getSetting('pm_cam', ''), shotData = null;

  function camLabel(d, i) {
    const l = (d.label || '').toLowerCase();
    const front = /front|user|facing front|أمام/.test(l);
    let name = front ? 'أمامية' : 'خلفية';
    if (/ultra|wide angle|0\.5|واسع/.test(l)) name += ' واسعة جداً';
    else if (/tele|zoom|تقريب/.test(l)) name += ' تقريب';
    else if (/wide/.test(l) && !front) name += ' عادية';
    if (/dual|triple/.test(l)) name += /triple/.test(l) ? ' ثلاثية' : ' مزدوجة';
    const num = (d.label.match(/camera2?\s*(\d+)/i) || [])[1];
    return `📷 ${name}${num !== undefined ? ' (' + num + ')' : ''}` || `كاميرا ${i + 1}`;
  }

  async function listCams() {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      cams = all.filter(d => d.kind === 'videoinput');
    } catch (e) { cams = []; }
    camList.innerHTML = '';
    // ترقيم الأسماء المكررة
    const seen = {};
    cams.forEach((d, i) => {
      let label = camLabel(d, i);
      seen[label] = (seen[label] || 0) + 1;
      if (seen[label] > 1) label += ' ' + seen[label];
      const b = document.createElement('button');
      b.textContent = label;
      b.title = d.label || '';
      b.classList.toggle('on', d.deviceId === camId);
      b.onclick = () => startStream(d.deviceId);
      camList.appendChild(b);
    });
    camList.style.display = cams.length > 1 ? 'flex' : 'none';
    document.getElementById('camSwitch').style.visibility = cams.length > 1 ? 'visible' : 'hidden';
  }

  function stopStream() {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }

  async function startStream(deviceId) {
    stopStream();
    camMsg.classList.remove('show');
    const base = { width: { ideal: 1920 }, height: { ideal: 1080 } };
    const tries = deviceId
      ? [{ video: { ...base, deviceId: { exact: deviceId } } }, { video: { ...base, facingMode: { ideal: 'environment' } } }]
      : [{ video: { ...base, facingMode: { ideal: 'environment' } } }, { video: true }];
    for (const c of tries) {
      try { camStream = await navigator.mediaDevices.getUserMedia({ ...c, audio: false }); break; } catch (e) { camStream = null; }
    }
    if (!camStream) {
      camMsg.textContent = 'تعذّر تشغيل الكاميرا. اسمح للمتصفح باستخدام الكاميرا، أو اختر صورة من المعرض.';
      camMsg.classList.add('show');
      return false;
    }
    camVideo.srcObject = camStream;
    try { await camVideo.play(); } catch (e) {}
    const s = camStream.getVideoTracks()[0].getSettings();
    camId = s.deviceId || deviceId || '';
    setSetting('pm_cam', camId);
    await listCams();   // أسماء الكاميرات تظهر بعد السماح بالكاميرا
    return true;
  }

  async function openCamera() {
    // متصفح قديم لا يدعم الكاميرا داخل الصفحة: نرجع لكاميرا الجوال العادية
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraInput.click(); return; }
    shotData = null;
    camModal.classList.remove('review');
    camModal.classList.add('open');
    document.getElementById('camTitle').textContent = `التقاط النقطة ${letter(points.length)}`;
    await startStream(camId);
  }

  function closeCamera() {
    stopStream();
    camModal.classList.remove('open', 'review');
    camVideo.srcObject = null;
  }

  document.getElementById('camClose').onclick = closeCamera;
  document.getElementById('camGallery').onclick = () => document.getElementById('galleryInput').click();
  // فتح تطبيقات الكاميرا المثبتة في الجوال (يظهر للمستخدم قائمة يختار منها)
  document.getElementById('camApps').onclick = () => {
    closeCamera();            // نحرر الكاميرا حتى يستطيع التطبيق الآخر استخدامها
    statusEl.textContent = 'اختر تطبيق الكاميرا، والتقط الصورة، ثم ارجع للصفحة.';
    cameraInput.click();
  };
  document.getElementById('camSwitch').onclick = () => {
    if (cams.length < 2) return;
    const i = cams.findIndex(d => d.deviceId === camId);
    startStream(cams[(i + 1) % cams.length].deviceId);
  };

  document.getElementById('camShutter').onclick = () => {
    if (!camStream || !camVideo.videoWidth) return;
    const w = camVideo.videoWidth, h = camVideo.videoHeight;
    const k = Math.min(1, 800 / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext('2d').drawImage(camVideo, 0, 0, cv.width, cv.height);
    shotData = cv.toDataURL('image/jpeg', 0.75);
    camShot.src = shotData;
    camModal.classList.add('review');
    if (navigator.vibrate) navigator.vibrate(40);
  };
  document.getElementById('camRetake').onclick = () => { shotData = null; camModal.classList.remove('review'); };
  document.getElementById('camUse').onclick = () => {
    if (!shotData) return;
    const data = shotData;
    closeCamera();
    locateAndAdd(data);
  };

  async function addPoint(imgData, c, opt = {}) {
    const p = {
      name: letter(points.length), img: imgData,
      lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6),
      acc: c.accuracy != null && isFinite(c.accuracy) ? Math.round(c.accuracy) : null,
      time: opt.time || new Date().toLocaleString('ar-SA'), pick: null,
      src: opt.src || 'gps'
    };
    points.push(p);
    if (points.length === 1) map.setView([p.lat, p.lng], 18);
    redraw(true);
    await persist();
    statusEl.textContent = `تم حفظ النقطة ${p.name} ✔ ` +
      (p.src === 'exif' ? '(الموقع من داخل الصورة)' : `(دقة ±${p.acc} م)`) +
      (watchId === null ? ' — تنبيه: تتبع المشي متوقف، فلن تُحسب المسافة الممشاة.' : '');
    if (autoPick.checked && !opt.noPick) startPick(points.length - 1);
  }
  const accText = p => p.acc != null ? p.acc : (p.src === 'exif' ? 'من الصورة' : '—');

  // ===== تحديد الإحداثية الثانية على الخريطة =====
  function startPick(i) {
    pickTarget = i;
    map.closePopup();
    document.body.classList.add('picking');
    document.getElementById('pickText').textContent = `📍 اضغط على الخريطة لتحديد الإحداثية الثانية للنقطة ${points[i].name}`;
    document.getElementById('pickBar').classList.add('show');
    const p = points[i];
    map.setView([p.lat, p.lng], Math.max(map.getZoom(), 18));
  }
  function stopPick() {
    pickTarget = null;
    document.body.classList.remove('picking');
    document.getElementById('pickBar').classList.remove('show');
  }
  document.getElementById('pickCancel').onclick = stopPick;

  map.on('click', async e => {
    if (pickTarget === null) return;
    const p = points[pickTarget];
    p.pick = { lat: +e.latlng.lat.toFixed(6), lng: +e.latlng.lng.toFixed(6) };
    stopPick();
    redraw();
    await persist();
    statusEl.textContent = `تم تحديد ${pickName(p)} — تبعد ${fmtLen(distM(p, p.pick))} عن ${p.name} ✔`;
  });

  async function removePick(i) {
    points[i].pick = null;
    redraw(); await persist();
    statusEl.textContent = `تم حذف الإحداثية المحددة للنقطة ${points[i].name}.`;
  }

  // ===== الرسم =====
  function fitAll() {
    const all = [...photoCoords(), ...pickedCoords(), ...track].map(c => [c.lat, c.lng]);
    if (all.length >= 2) map.fitBounds(L.latLngBounds(all).pad(0.2));
    else if (all.length === 1) map.setView(all[0], 18);
  }

  function redraw(fit) {
    const pc = photoCoords().map(c => [c.lat, c.lng]);
    if (isClosed() && pc.length >= 3) { shape.setLatLngs(pc); line.setLatLngs([]); }
    else { shape.setLatLngs([]); line.setLatLngs(pc); }

    const hasPick = pickedCount() > 0;
    const kc = pickedCoords().map(c => [c.lat, c.lng]);
    if (hasPick && isClosed() && kc.length >= 3) { pickShape.setLatLngs(kc); pickLine.setLatLngs([]); }
    else if (hasPick) { pickShape.setLatLngs([]); pickLine.setLatLngs(kc); }
    else { pickShape.setLatLngs([]); pickLine.setLatLngs([]); }

    // العلامات
    layer.clearLayers();
    photoMarkers = [];
    points.forEach((p, i) => {
      const icon = L.divIcon({ className: '', html: `<div class="letter-icon">${p.name}</div>`, iconSize: [34, 34], iconAnchor: [17, 17] });
      const m = L.marker([p.lat, p.lng], { icon }).addTo(layer);
      const box = document.createElement('div');
      box.className = 'popup-box';
      box.innerHTML = `<img src="${p.img}"><b>النقطة ${p.name}</b><br><span dir="ltr">${ll(p)}</span><br><small>${p.time}</small>
        ${p.pick ? `<br><small style="color:#e65100">${pickName(p)}: <span dir="ltr">${ll(p.pick)}</span> — ${fmtLen(distM(p, p.pick))}</small>` : ''}<br>`;
      const btn = document.createElement('button');
      btn.textContent = p.pick ? '📍 تغيير الإحداثية الثانية' : '📍 تحديد إحداثية ثانية';
      btn.onclick = () => startPick(i);
      box.appendChild(btn);
      m.bindPopup(box, { maxWidth: 210 });
      photoMarkers.push(m);

      if (p.pick) {
        const picon = L.divIcon({ className: '', html: `<div class="pick-icon">${pickName(p)}</div>`, iconSize: [34, 26], iconAnchor: [17, 13] });
        const pm = L.marker([p.pick.lat, p.pick.lng], { icon: picon, draggable: true }).addTo(layer);
        pm.bindTooltip('اسحب لتعديل الموقع', { direction: 'top' });
        pm.on('dragend', async ev => {
          const q = ev.target.getLatLng();
          p.pick = { lat: +q.lat.toFixed(6), lng: +q.lng.toFixed(6) };
          redraw(); await persist();
        });
        L.polyline([[p.lat, p.lng], [p.pick.lat, p.pick.lng]], { color: '#fff', weight: 2, dashArray: '4 5' })
          .addTo(layer)
          .bindTooltip(fmtLen(distM(p, p.pick)), { permanent: true, direction: 'center', className: 'dist-tip' });
      }
    });

    if (fit) fitAll();

    // الجدول
    const tbody = document.querySelector('#pointsTable tbody');
    tbody.innerHTML = '';
    let sumD = 0;
    points.forEach((p, i) => {
      const d = p.pick ? distM(p, p.pick) : null;
      if (d !== null) sumD += d;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${p.name}</b></td>
        <td><img src="${p.img}"></td>
        <td><span class="ll">${ll(p)}</span>${p.src === 'exif' ? '<br><small style="color:#2e7d32">📷 من الصورة</small>' : ''}</td>
        <td>${p.pick ? `<span class="ll pk">${ll(p.pick)}</span><br>` : ''}</td>
        <td>${d !== null ? `<span class="dist">${fmtLen(d)}</span>` : '—'}</td>
        <td><small>${p.time}</small></td>`;
      const cell = tr.children[3];
      const b1 = document.createElement('button');
      b1.className = 'mini btn-pick';
      b1.textContent = p.pick ? '📍 تغيير' : '📍 تحديد';
      b1.onclick = ev => { ev.stopPropagation(); startPick(i); };
      cell.appendChild(b1);
      if (p.pick) {
        const b2 = document.createElement('button');
        b2.className = 'mini btn-del'; b2.textContent = '✖';
        b2.onclick = ev => { ev.stopPropagation(); removePick(i); };
        cell.appendChild(b2);
      }
      tr.onclick = () => { map.setView([p.lat, p.lng], 19); photoMarkers[i].openPopup(); };
      tbody.appendChild(tr);
    });

    const n = pickedCount();
    const sp = specStats();
    document.querySelector('#pointsTable tfoot').innerHTML = n ? `
      <tr><td colspan="4">عدد الإحداثيات المحددة: ${n} من ${points.length}</td>
      <td colspan="2">متوسط المسافة: ${fmtLen(sumD / n)}</td></tr>
      ${sp.dist !== null ? `<tr><td colspan="4">${sp.label}</td><td colspan="2">${fmtLen(sp.dist)}</td></tr>` : ''}` : '';

    pdfBtn.disabled = undoBtn.disabled = points.length === 0;
    updateSummary();
  }

  function updateSummary() {
    const box = document.getElementById('summary');
    if (!points.length && !track.length) { box.classList.remove('show'); return; }
    box.classList.add('show');
    const w = walkedDist(), s = specStats(), r = ratio();
    document.getElementById('sWalk').textContent = w > 0 ? fmtLen(w) : '—';
    document.getElementById('sWalkSub').textContent = `${track.length} نقطة GPS مقبولة، ${rejected} مستبعدة`;
    document.getElementById('sSpecLabel').textContent = s.label;
    document.getElementById('sSpec').textContent = s.dist !== null ? fmtLen(s.dist) : '—';
    document.getElementById('sSpecSub').textContent =
      s.dist === null ? 'حدّد إحداثيتين على الأقل' :
      `${s.n} إحداثيات محددة` + (s.closed && s.area !== null ? ` — المساحة: ${fmtArea(s.area)}` : '');
    const pe = document.getElementById('sPct');
    pe.textContent = r.text;
    pe.classList.toggle('msg', !r.ok);
  }

  function resizeImage(file, maxSize) {
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxSize / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = img.width * k; cv.height = img.height * k;
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          resolve(cv.toDataURL('image/jpeg', 0.75));
        };
        img.src = ev.target.result;
      };
      r.readAsDataURL(file);
    });
  }

  // ===== صورة الخريطة للطباعة =====
  const TILE_IMG = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/';
  const TILE_LBL = 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/';
  function loadImg(src) {
    return new Promise(res => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = src;
    });
  }
  function project(lat, lng, z) {
    const s = 256 * Math.pow(2, z), r = lat * Math.PI / 180;
    return [(lng + 180) / 360 * s, (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * s];
  }
  function drawPath(ctx, pts, closed) {
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (closed && pts.length >= 3) ctx.closePath();
  }
  async function mapImage() {
    const W = 1400, H = 900;
    const all = [...photoCoords(), ...pickedCoords(), ...track];
    let z = 19;
    for (; z > 2; z--) {
      const xy = all.map(p => project(p.lat, p.lng, z));
      const w = Math.max(...xy.map(a => a[0])) - Math.min(...xy.map(a => a[0]));
      const h = Math.max(...xy.map(a => a[1])) - Math.min(...xy.map(a => a[1]));
      if (w * 1.3 <= W && h * 1.3 <= H) break;
    }
    const axy = all.map(p => project(p.lat, p.lng, z));
    const cx = (Math.max(...axy.map(a => a[0])) + Math.min(...axy.map(a => a[0]))) / 2;
    const cy = (Math.max(...axy.map(a => a[1])) + Math.min(...axy.map(a => a[1]))) / 2;
    const ox = cx - W / 2, oy = cy - H / 2;
    const toPx = c => { const [x, y] = project(c.lat, c.lng, z); return [x - ox, y - oy]; };

    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ddd'; ctx.fillRect(0, 0, W, H);

    const jobs = [];
    for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + W) / 256); tx++)
      for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + H) / 256); ty++)
        jobs.push(Promise.all([loadImg(`${TILE_IMG}${z}/${ty}/${tx}`), loadImg(`${TILE_LBL}${z}/${ty}/${tx}`)])
          .then(([a, b]) => ({ tx, ty, a, b })));
    for (const { tx, ty, a, b } of await Promise.all(jobs)) {
      if (a) ctx.drawImage(a, tx * 256 - ox, ty * 256 - oy);
      if (b) ctx.drawImage(b, tx * 256 - ox, ty * 256 - oy);
    }

    // مسار المشي (أخضر)
    if (track.length >= 2) {
      drawPath(ctx, track.map(toPx), false);
      ctx.setLineDash([]); ctx.strokeStyle = '#00e676'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke();
    }

    const closed = isClosed();
    const pp = points.map(p => toPx(p));
    // الشكل الأزرق (الصور)
    drawPath(ctx, pp, closed);
    if (closed && pp.length >= 3) { ctx.fillStyle = 'rgba(59,59,255,.15)'; ctx.fill(); }
    ctx.setLineDash([]); ctx.strokeStyle = '#3b3bff'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();

    // الشكل البرتقالي (المحدد)
    if (pickedCount()) {
      const kp = pickedCoords().map(toPx);
      drawPath(ctx, kp, closed);
      if (closed && kp.length >= 3) { ctx.fillStyle = 'rgba(239,108,0,.2)'; ctx.fill(); }
      ctx.setLineDash([16, 10]); ctx.strokeStyle = '#ef6c00'; ctx.lineWidth = 5; ctx.stroke();
      ctx.setLineDash([]);
    }

    // خطوط الربط بين النقطة وإحداثيتها
    points.forEach((p, i) => {
      if (!p.pick) return;
      const [x2, y2] = toPx(p.pick);
      ctx.beginPath(); ctx.moveTo(pp[i][0], pp[i][1]); ctx.lineTo(x2, y2);
      ctx.setLineDash([6, 6]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]);
    });

    let minD = Infinity;
    for (let i = 0; i < pp.length; i++) for (let j = i + 1; j < pp.length; j++)
      minD = Math.min(minD, Math.hypot(pp[i][0] - pp[j][0], pp[i][1] - pp[j][1]));
    const rad = Math.max(12, Math.min(22, minD / 2 - 1));

    // علامات المحدد
    points.forEach(p => {
      if (!p.pick) return;
      const [x, y] = toPx(p.pick);
      const w = rad * 2.2, h = rad * 1.6;
      ctx.fillStyle = '#ef6c00'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.rect(x - w / 2, y - h / 2, w, h); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(rad * 0.8)}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(pickName(p), x, y + 1);
    });
    // علامات الصور
    pp.forEach(([x, y], i) => {
      ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
      const name = points[i].name;
      ctx.fillStyle = '#000'; ctx.font = `bold ${Math.round(rad * (name.length > 1 ? 0.8 : 1))}px Arial`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(name, x, y + 1);
    });

    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center';
    ctx.fillText('N ↑', 50, 45);
    ctx.font = '14px Arial'; ctx.textAlign = 'left'; ctx.fillText('Imagery © Esri', 10, H - 12);

    try { return cv.toDataURL('image/jpeg', 0.9); }
    catch (e) { return null; }
  }

  // ===== تصدير PDF =====
  pdfBtn.onclick = async () => {
    stopPick();
    pdfBtn.disabled = true;
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageW = 210, pageH = 297, margin = 10;
      const report = document.getElementById('report');
      const pages = [];
      const n = pickedCount();
      const sp = specStats(), wk = walkedDist(), rt = ratio();

      const row = p => {
        const d = p.pick ? fmtLen(distM(p, p.pick)) : '—';
        return `<tr><td><b>${p.name}</b></td><td dir="ltr">${ll(p)}</td><td dir="ltr" style="color:#e65100">${p.pick ? ll(p.pick) : '—'}</td><td><b>${d}</b></td><td>${accText(p)}</td><td>${p.time}</td></tr>`;
      };
      const head = `<thead><tr><th>النقطة</th><th>إحداثيات الصورة</th><th>الإحداثية المحددة</th><th>المسافة</th><th>الدقة (م)</th><th>الوقت</th></tr></thead>`;

      const sum = `<div class="sumrow">
          <div>إجمالي المسافة الممشاة<b>${wk > 0 ? fmtLen(wk) : '—'}</b>${track.length} نقطة GPS — مستبعدة: ${rejected}</div>
          <div>${sp.label}<b>${sp.dist !== null ? fmtLen(sp.dist) : '—'}</b>${sp.closed && sp.area !== null ? 'المساحة: ' + fmtAreaFull(sp.area) : sp.n + ' إحداثيات محددة'}</div>
          <div class="p">نسبة المحدد من الممشى<b style="${rt.ok ? '' : 'font-size:11px;color:#a33'}">${rt.text}</b></div>
        </div>`;

      statusEl.textContent = 'جاري تحميل صورة الخريطة...';
      const mapImg = await mapImage();
      statusEl.textContent = 'جاري إنشاء ملف PDF...';
      const firstRows = 10, nextRows = 34;
      pages.push(`
        <h2>تقرير إحداثيات النقاط</h2>
        <div class="meta">عدد النقاط: ${points.length} — المحددة: ${n} — ${sp.dist === null ? '—' : (sp.closed ? 'شكل مغلق' : 'مسار مفتوح')} — حد دقة GPS: ${ACC_LIMIT} م<br>تاريخ التقرير: ${new Date().toLocaleString('ar-SA')}</div>
        ${sum}
        <div class="shape">${mapImg ? `<img src="${mapImg}" style="width:100%;border-radius:6px;border:1px solid #ccd">` : ''}
          <div class="legend"><span style="background:#3b3bff"></span>إحداثيات الصور<span style="background:#ef6c00"></span>الإحداثيات المحددة<span style="background:#00e676"></span>مسار المشي</div>
        </div>
        <table>${head}<tbody>${points.slice(0, firstRows).map(row).join('')}</tbody></table>`);
      for (let i = firstRows; i < points.length; i += nextRows)
        pages.push(`<table>${head}<tbody>${points.slice(i, i + nextRows).map(row).join('')}</tbody></table>`);

      const perPage = 20, totalPhotoPages = Math.ceil(points.length / perPage);
      for (let i = 0; i < points.length; i += perPage) {
        pages.push(`
          <h2>صور النقاط (${i / perPage + 1} / ${totalPhotoPages})</h2>
          <div class="grid">${points.slice(i, i + perPage).map(p => `
            <div class="card">
              <img src="${p.img}">
              <b>${p.name}</b>
              <div class="c">${ll(p)}</div>
              ${p.pick ? `<div class="o">${pickName(p)} ${ll(p.pick)} — ${fmtLen(distM(p, p.pick))}</div>` : ''}
              <div>${p.time}</div>
            </div>`).join('')}
          </div>`);
      }

      report.classList.add('on');
      for (let c = 0; c < pages.length; c++) {
        statusEl.textContent = `جاري إنشاء الصفحة ${c + 1} من ${pages.length}...`;
        report.innerHTML = pages[c];
        const canvas = await html2canvas(report, {
          scale: 2, backgroundColor: '#ffffff',
          windowWidth: 900, scrollX: 0, scrollY: 0
        });
        const w = pageW - margin * 2;
        const h = Math.min(canvas.height * w / canvas.width, pageH - margin * 2);
        if (c > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', margin, margin, w, h);
      }
      pdf.save('إحداثيات_النقاط.pdf');
      statusEl.textContent = 'تم تصدير ملف PDF ✔';
    } catch (e) {
      statusEl.textContent = 'حدث خطأ أثناء التصدير: ' + e.message;
    }
    report.innerHTML = '';
    report.classList.remove('on');
    pdfBtn.disabled = points.length === 0;
  };

  // ===== تراجع ومسح =====
  undoBtn.onclick = async () => {
    if (!points.length) return;
    stopPick();
    const last = points[points.length - 1];
    if (last.pick) last.pick = null; else points.pop();
    redraw(); await persist();
    statusEl.textContent = 'تم التراجع عن آخر خطوة.';
  };

  document.getElementById('clearBtn').onclick = async () => {
    if ((!points.length && !track.length) || !confirm('مسح جميع النقاط والصور ومسار المشي نهائياً؟')) return;
    stopPick();
    stopTrack();
    points = []; track = []; rejected = 0;
    trackLine.setLatLngs([]);
    trackBtn.textContent = '🚶 بدء تتبع المشي';
    redraw(); await persist(); await persistTrack();
    updateTrackInfo();
    statusEl.textContent = 'تم المسح.';
  };

  // ===== البدء =====
  applyView();
  applyShape();
  (async () => {
    const st = await DB.load('track', { track: [], rejected: 0 });
    track = Array.isArray(st.track) ? st.track : [];
    rejected = st.rejected || 0;
    trackLine.setLatLngs(track.map(c => [c.lat, c.lng]));
    if (track.length) trackBtn.textContent = '🚶 متابعة تتبع المشي';
    updateTrackInfo();
    updateSummary();
    const saved = await DB.load();
    if (saved.length) {
      points = saved.map(p => ({ pick: null, ...p }));
      redraw(true);
      statusEl.textContent = `تم استرجاع ${points.length} نقطة محفوظة ✔`;
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  })();
</script>
</body>
</html>
